name: Deploy API (Cloudflare Worker)
on:
  push:
    branches: [main]
    paths: ["workers/api/**", "packages/database/schema/**", ".github/workflows/worker.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm test -w workers/api
      # Deploy-only credentials. No database credentials live in GitHub.
      - run: npx wrangler deploy
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
